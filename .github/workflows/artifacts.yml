# The artifacts we PUBLISH, checked on every push.
#
# WHY THIS EXISTS. On 2026-08-12 the shipped ramr_traces_v0.1.jsonl and the v0.2 pair derived from it
# came from two different generator runs -- same 300 queries, and not one of 300 traces holding the
# same record_ids, so joining them matched nothing, silently. It was found by an outside reader's
# question, not by us, and the reply disclosing it had to admit that the checker written to catch the
# class was a script nobody ran. A guard with no caller is the same defect wearing a fix's clothes.
#
# All three checks are stdlib plus the vendored inspeximus package, so there is nothing to install.
name: artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Does every file we ship match its recorded hash, and is every published file pinned at all?
      # The README advertises a "sha256-pinned manifest"; until 2026-08-12 it pinned one file, with a
      # hash matching no committed version of it, and nothing ever checked.
      - name: manifest pins hold
        run: python verify_manifest.py

      # Do the files we ship agree with each other? Reads the artifacts on disk, NOT a fresh
      # generation -- a fresh run rebuilds both sides from one generation and they agree by
      # construction, which is exactly how the defect stayed invisible.
      - name: published trace pair joins
        run: python ramr_traces_pair_consistency.py

      # The baseline's numbers, and the controls that make them mean something.
      - name: twin baseline order-invariance + controls
        run: python ramr_traces_order_invariance.py

      # The known content shortcut. This one is expected to FIND something: it reports the size of a
      # leak we have not yet fixed, so it must keep running and keep saying so out loud.
      - name: value-echo shortcut (reports a known, unfixed leak)
        run: python ramr_traces_value_echo_shortcut.py

      # ERRATA 4. A figure quoted in three files with no receipt behind it. This rebuilds the
      # corpus under the id scheme that produced it and refuses if its own runs all agree, because
      # the generator mints uuid4 ids and a point estimate here would be another unreproducible
      # number. 20 runs is the CI budget; the published envelope is over 100.
      - name: id-cue reconstruction (205 of 300 does not reproduce)
        run: python ramr_id_cue_reconstruction.py --runs 20

      # The audit battery's own calibration: silent on synthetic clean data, sees a planted cue.
      # A shortcut battery with no null is a machine for manufacturing alarming numbers.
      - name: memaudit calibration (negative + positive control)
        run: python test_memaudit.py

      # The published shortcut floor for our own traces. Expected to report a high number until the
      # generator is re-cut; the point is that it is printed, not that it is small.
      - name: memaudit floor on RAMR v0.2
        run: python memaudit.py --adapter ramr

      # v0.3, the structural re-cut. Still reports a floor -- that is the point. A re-cut that is not
      # measured afterwards is a hope, and this one removed two cues while a third survived inverted.
      - name: memaudit floor on RAMR v0.3
        run: python memaudit.py --adapter ramr --blind ramr_traces_v0.3_blind.jsonl --labels ramr_traces_v0.3_labels.jsonl

      # v0.5: connectivity balanced by construction. The floor here is near nothing, which is exactly
      # when a clean result deserves the least trust -- the id-outlier probe exists because balancing
      # the echo cue introduced a brighter one, and every other probe read "at chance" on it.
      - name: memaudit floor on RAMR v0.5
        run: python memaudit.py --adapter ramr --blind ramr_traces_v0.5_blind.jsonl --labels ramr_traces_v0.5_labels.jsonl

      # The scoring runner's own controls: a null that flags nothing must read 0.00/0.00 and an oracle
      # that reads the label must reach 1.00/0.00. If either moves, every score it reports is about the
      # harness rather than the detector.
      - name: scoring harness controls (v0.5)
        run: python ramr_score_traces.py --version 0.5

      # The receipt-binding cell. It was the file in this repo arguing that a check nobody calls is
      # not a check, and it was the one artifact here run by hand -- "a guard with no caller is the
      # same defect wearing a fix's clothes", per the top of this file.
      #
      # Its adversarial rows ARE the test: _always_valid, _always_stale, _underbound and _unscoped
      # must each keep failing the exact scenario they are built to fail, and the cell exits 1 if
      # any of them stops failing. A live mutation that reverted the S6 fix once left every control
      # green because only those rows were checked -- that is what this step now catches on push.
      #
      # stdlib only, like the steps above -- and the one step here that does NOT see the vendored
      # inspeximus. The steps above are run from the repo root, so root IS the script directory and
      # the vendored package imports; this file lives in integrity/, so root is not on sys.path and
      # the row declines with "No module named 'inspeximus'". Measured in this workflow's own log,
      # after a first version of this comment blamed the vendored 2.5.0 signature instead -- same
      # outcome, wrong cause.
      #
      # Either way the artifact says `complete: false`, accurately: one backend did not run. If the
      # more useful decline is the row's own requirement message ("has witness(); this row needs
      # witness(records=, bind_sources=)"), run it as `python -m integrity.receipt_binding` from the
      # root -- that imports the vendored 2.5.0 and the row states what it needs rather than
      # reporting an absence.
      - name: receipt-binding cell (adversarial controls must keep failing)
        run: python integrity/receipt_binding.py

      # The calibration-dataset checker, written for deepseek-ai/DeepSeek-V3#1591 so a proposed usage
      # guide would ship something that can fail. It was committed on 2026-08-21 with NO caller here,
      # which is the defect named at the top of this file, in the repo that names it.
      #
      # --self-test is the part that needs no external data: it mutates each check and asserts the
      # failure lands on THAT check's own row, asserts the clean fixture still passes, asserts an
      # empty file yields no PASS at all, and carries a negative control on the harness itself (a
      # fixture where an unrelated row fails, which a loose "something failed" assertion would take).
      # Mutation score 6/6 -- reverting any of the six fixes turns this step red.
      - name: calibration-dataset checker (mutation controls, 6/6)
        run: python integrity/calibration_dataset_check.py --self-test
